# Render Blueprint: FP Quest als statische site (gratis).
services:
  - type: web
    name: fp-quest
    runtime: static
    buildCommand: echo "Geen build nodig"
    staticPublishPath: ./public
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
