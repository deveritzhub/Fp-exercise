# Render Blueprint for FP Exercise (currently: demo with synthetic data only).
# Web service in Frankfurt (EU). Currently on the FREE plan (sleeps after 15 min idle, uploads are not kept).
# Upgrade later: set plan: starter and uncomment the disk + STORAGE_DIR lines below (~$7.25/month).
# Database: Neon Postgres project in Frankfurt (see DEPLOY.md).
services:
  - type: web
    name: fp-exercise
    runtime: node
    region: frankfurt
    plan: free             # upgrade: starter (~$7/month, always on)
    buildCommand: npm ci --include=dev && npx vite build   # typecheck runs in CI; keeps the free 512 MB build light
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    # disk:                # with plan: starter — uploads survive restarts (~$0.25/GB/month)
    #   name: media
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_ADMIN_URL
        sync: false          # paste the Neon connection string when Render asks
      - key: ROLE_PASSWORD_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      - key: VITE_SHOW_DEMO_ACCOUNTS
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: MAIL_TRANSPORT
        value: outbox
      # --- WhatsApp/phone assistant (server/src/agents, docs/AGENTS.md). Leave empty to keep it off. ---
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: OWNER_WHATSAPP
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: PRACTICE_HOURS          # e.g. "ma-vr 08:00-18:00"; outside these hours: "we zijn gesloten" + callback, no transfer
        sync: false
      - key: AGENT_ADMIN_KEY
        generateValue: true
      # - key: STORAGE_DIR    # with the disk above
      #   value: /var/data/storage
