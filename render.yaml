# Render Blueprint for FP Exercise (currently: demo with synthetic data only).
# Web service in Frankfurt (EU), on the Starter plan (always on) with a 1 GB disk for uploads (~$7.25/month).
# Set in the Render dashboard, never here: DEMO_PASSWORD or DEMO_ACCOUNTS, and for real mail
# MAIL_TRANSPORT=smtp with SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, MAIL_FROM (see DEPLOY.md).
# Database: Neon Postgres project in Frankfurt (see DEPLOY.md).
services:
  - type: web
    name: fp-exercise
    runtime: node
    region: frankfurt
    plan: starter          # always on; reminders go out on time
    buildCommand: npm ci --include=dev && npx vite build   # typecheck runs in CI; keeps the free 512 MB build light
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    disk:                  # uploads survive restarts (~$0.25/GB/month)
      name: media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_ADMIN_URL
        sync: false          # paste the Neon connection string when Render asks
      - key: ROLE_PASSWORD_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      # MAIL_TRANSPORT is left out on purpose: it defaults to the outbox (nothing is sent), and the
      # owner switches it to smtp in the dashboard once a mail provider is set up.
      - key: STORAGE_DIR     # on the disk above; the library videos and hero pictures are put back at every start
        value: /var/data/storage
