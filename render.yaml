# Render Blueprint for FP Exercise (currently: demo with synthetic data only).
# Always-on web service in Frankfurt (EU) with a persistent disk for uploaded videos/images.
# Database: Neon Postgres project in Frankfurt (see DEPLOY.md).
services:
  - type: web
    name: fp-exercise
    runtime: node
    region: frankfurt
    plan: starter          # paid (~$7/month): always on, no sleeping
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:hosted
    healthCheckPath: /api/health
    disk:                  # uploads survive restarts and new deploys (~$0.25/GB/month)
      name: media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_ADMIN_URL
        sync: false          # paste the Neon connection string when Render asks
      - key: ROLE_PASSWORD_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      - key: VITE_SHOW_DEMO_ACCOUNTS
        value: "1"
      - key: TRUST_PROXY
        value: "1"
      - key: MAIL_TRANSPORT
        value: outbox
      - key: STORAGE_DIR
        value: /var/data/storage
