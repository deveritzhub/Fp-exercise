<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Jarvis</title>
<style>
  :root { --bg:#0b1020; --panel:#121a33; --text:#e6ecff; --muted:#8a96bf; --accent:#4fd1ff; --me:#1d2a52; --border:#22305e; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6fb; --panel:#ffffff; --text:#111827; --muted:#5b6476; --accent:#0077b6; --me:#e3ecff; --border:#d7deec; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; height:100dvh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); }
  .orb { width:28px; height:28px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff, var(--accent) 45%, transparent 70%); box-shadow:0 0 18px var(--accent); }
  .busy .orb { animation:pulse 1s infinite ease-in-out; }
  @keyframes pulse { 50% { transform:scale(.8); opacity:.6; } }
  h1 { font-size:18px; margin:0; letter-spacing:.08em; }
  #status { color:var(--muted); font-size:13px; margin-left:auto; }
  select, button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }
  main { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; max-width:860px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-wrap:break-word; max-width:100%; }
  .me { background:var(--me); align-self:flex-end; }
  .ai { background:var(--panel); border:1px solid var(--border); }
  .msg code { background:rgba(127,127,127,.15); padding:1px 4px; border-radius:4px; }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--border); max-width:860px; width:100%; margin:0 auto; }
  textarea { flex:1; resize:none; font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:10px; min-height:46px; max-height:160px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; padding:0 16px; max-width:860px; width:100%; margin:0 auto; }
  .chips button { font-size:13px; padding:4px 10px; border-radius:999px; color:var(--muted); }
  #send { background:var(--accent); color:#001; border:none; font-weight:600; }
</style>
</head>
<body>
<header>
  <div class="orb"></div><h1>JARVIS</h1>
  <select id="provider" aria-label="AI kiezen">
    <option value="claude">Claude</option>
    <option value="chatgpt">ChatGPT</option>
  </select>
  <span id="status"></span>
</header>
<main id="chat"></main>
<div class="chips">
  <button data-cmd="/briefing">☀️ Briefing</button>
  <button data-cmd="/inbox">📥 Inbox opruimen</button>
  <button data-cmd="/geheugen">🧠 Geheugen</button>
  <button data-cmd="/bewaar">💾 Bewaar gesprek</button>
  <button data-cmd="/nieuw">🆕 Nieuw</button>
  <button data-cmd="/help">❓ Help</button>
  <button id="mic" type="button">🎙️ Spreek</button>
</div>
<form id="form">
  <textarea id="input" placeholder="Vraag iets, of /notitie …" rows="1"></textarea>
  <button id="send">Stuur</button>
</form>
<script>
const $ = s => document.querySelector(s);
let key = '';
try { key = localStorage.getItem('jarvis-key') || ''; } catch {}

async function api(path, body) {
  const res = await fetch(path, {
    method: body ? 'POST' : 'GET',
    headers: { 'Content-Type': 'application/json', 'X-Jarvis-Key': key },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (res.status === 401) {
    key = prompt('Wachtwoord voor Jarvis:') || '';
    try { localStorage.setItem('jarvis-key', key); } catch {}
    return api(path, body);
  }
  return res;
}

function esc(s) { return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render(s) {
  return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
               .replace(/^### (.*)$/gm, '<b>$1</b>');
}
function add(cls, text) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = render(text);
  $('#chat').append(d); d.scrollIntoView({ block: 'end' }); return d;
}

async function refresh() {
  const s = await (await api('/api/status')).json();
  $('#provider').value = s.provider;
  $('#status').textContent = `${s.notes} notities · ${s.facts} feiten` +
    (s.claude ? '' : ' · ⚠️ geen Claude-sleutel') + (s.chatgpt ? '' : ' · ⚠️ geen ChatGPT-sleutel');
}

async function send(text) {
  if (!text.trim()) return;
  add('me', text);
  const out = add('ai', '…'); let buf = '';
  document.body.classList.add('busy');
  try {
    const res = await api('/api/chat', { message: text });
    const reader = res.body.getReader(); const dec = new TextDecoder();
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true }); out.innerHTML = render(buf);
      out.scrollIntoView({ block: 'end' });
    }
    if (!buf) out.textContent = '(geen antwoord)';
  } catch (e) { out.textContent = '⚠️ ' + e; }
  document.body.classList.remove('busy');
  refresh();
}

$('#form').onsubmit = e => { e.preventDefault(); const t = $('#input').value; $('#input').value = ''; send(t); };
$('#input').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#form').requestSubmit(); } };
$('#provider').onchange = e => send('/' + e.target.value);
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send(b.dataset.cmd));

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR(); rec.lang = 'nl-NL';
  rec.onresult = e => send(e.results[0][0].transcript);
  $('#mic').onclick = () => rec.start();
} else { $('#mic').style.display = 'none'; }

add('ai', 'Goedendag. Ik ben Jarvis, je tweede brein. Waar kan ik mee helpen? (typ /help)');
refresh();
</script>
</body>
</html>
