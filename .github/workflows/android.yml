# Builds the Google Play app (Trusted Web Activity around the web app).
# - Always: a debug APK to install directly on an Android phone for testing.
# - With the upload-key secrets set: a signed AAB to upload in the Google Play Console.
#   Secrets: FP_KEYSTORE_BASE64, FP_KEYSTORE_PASSWORD, FP_KEY_ALIAS, FP_KEY_PASSWORD (see docs/ANDROID.md).
name: Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FP_VERSION_CODE: ${{ github.run_number }}
      FP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Debug APK (for testing on a phone)
        run: gradle -p android assembleDebug --no-daemon

      - name: Upload key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.FP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "path=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Signed AAB (for Google Play)
        if: steps.key.outputs.path != ''
        env:
          FP_KEYSTORE_PATH: ${{ steps.key.outputs.path }}
          FP_KEYSTORE_PASSWORD: ${{ secrets.FP_KEYSTORE_PASSWORD }}
          FP_KEY_ALIAS: ${{ secrets.FP_KEY_ALIAS }}
          FP_KEY_PASSWORD: ${{ secrets.FP_KEY_PASSWORD }}
        run: gradle -p android bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: fp-exercise-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.path != ''
        with:
          name: fp-exercise-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
